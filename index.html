<!-- אזור העלאת תמונות - מוסתר מלקוחות (הנהלה בלבד) -->
<div id="adminUploadSection" class="hidden my-12 max-w-2xl mx-auto">
  <div class="bg-amber-50 border-2 border-dashed border-amber-500 rounded-3xl p-8 text-center relative shadow-inner">
    <span class="absolute top-3 right-4 bg-amber-700 text-white text-xs font-bold px-2.5 py-1 rounded-full">אזור מנהל</span>
    
    <div class="w-12 h-12 bg-amber-700 text-white rounded-xl flex items-center justify-center text-xl mx-auto mb-3">
      <i class="fa-solid fa-cloud-arrow-up"></i>
    </div>
    <h3 class="font-extrabold text-xl text-gray-900 mb-1">העלאת פרויקט חדש לגלריה</h3>
    <p class="text-xs text-gray-600 mb-5">העלה תמונה חדשה כדי לעדכן את גלריית העבודות באתר</p>
    
    <form onsubmit="event.preventDefault(); alert('התמונה הועלתה בהצלחה לגלריה!');">
      <label class="cursor-pointer bg-amber-700 hover:bg-amber-800 text-white font-bold py-3 px-6 rounded-xl shadow transition inline-flex items-center gap-2 text-sm">
        <i class="fa-solid fa-plus"></i>
        <span>בחר תמונה מהמחשב</span>
        <input type="file" class="hidden" accept="image/*" onchange="alert('תמונה נבחרה מוכנה להעלאה')">
      </label>
    </form>
  </div>
</div>

<!-- כפתור סודי בתחתית הדף לפתיחת אזור המנהל -->
<div class="text-center py-4">
  <button onclick="toggleAdmin()" class="text-xs text-gray-300 hover:text-gray-500 transition">
    <i class="fa-solid fa-lock text-[10px]"></i> כניסת מנהל
  </button>
</div>

<script>
  function toggleAdmin() {
    const password = prompt("הכנס סיסמת מנהל להצגת אזור העלאת התמונות:");
    // תוכל לשנות את הסיסמה "1234" לכל סיסמה שתבחר
    if (password === "1234") {
      document.getElementById('adminUploadSection').classList.remove('hidden');
      alert("שלום מנהל! אזור העלאת התמונות פעיל כעת.");
    } else if (password !== null) {
      alert("סיסמה שגויה!");
    }
  }
</script>
